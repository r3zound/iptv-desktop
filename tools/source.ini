; ============================================================
;   collect-iptv-desktop -- source configuration
;
;   Layout:
;     [sources.<name>]   one section per upstream m3u source
;     [merge]            how to combine sources
;     [player]           PotPlayer auto-detect / override
;
;   Three sources ship enabled out of the box:
;     collect-iptv   -- zilong7728/Collect-IPTV's pre-sorted playlist
;                       (primary; small, curated, already classified)
;     iptv-org       -- iptv-org/iptv's full index (138k+ channels,
;                       GitHub Pages; slower / sometimes unreachable)
;     (the rest disabled by default; uncomment + fill url= to use)
; ============================================================

; ----- Primary: zilong7728/Collect-IPTV -----
; jsDelivr first (raw.githubusercontent.com often SSL times out in CN).
[sources.collect-iptv]
url = https://cdn.jsdelivr.net/gh/zilong7728/Collect-IPTV@main/best_sorted.{ext}
format = m3u
mirrors = https://raw.githubusercontent.com/zilong7728/Collect-IPTV/main/best_sorted.{ext}|https://zilong7728.github.io/Collect-IPTV/best_sorted.{ext}
enabled = 1

; ----- Secondary: iptv-org/iptv -----
[sources.iptv-org]
url = https://iptv-org.github.io/iptv/index.m3u
format = m3u
mirrors =
enabled = 1

; ----- Optional: Guovin/iptv-api (your own fork) -----
; Guovin's public output URL was deprecated. To use Guovin's
; CCTV+卫視 whitelist output you need to fork the repo, enable its
; GitHub Actions workflow, and paste your fork's release URL below.
;
; This config is pre-set for r3zound/iptv-api. Enable after running
; the workflow once -- see README.md for step-by-step instructions.
; If Guovin's URL is unreachable, the exe falls back to other sources.
[sources.guovin-fork]
url = https://github.com/r3zound/iptv-api/releases/download/playlist-latest/result.m3u
format = m3u
mirrors =
enabled = 1

; ----- Optional: bjzhou/iptv-collector -----
; Self-hosted tool; no public m3u. Paste a self-run m3u URL if you have one.
[sources.bjzhou-fork]
url =
format = m3u
mirrors =
enabled = 0

; ----- Optional: tmxk2020/ITV -----
; 0 stars; self-hosted. Paste a self-run m3u URL if you have one.
[sources.tmxk2020-fork]
url =
format = m3u
mirrors =
enabled = 0

; ----- Merge options -----
[merge]
; How many URLs to keep per normalized channel name. Set to 0 for no cap.
; 3 = top 3 quality variants (HD/FHD/4K) per channel.
per_channel_cap = 3

; ----- Filters (URL blocklist + name filters + tier probe) -----
; Filter order (cheap -> expensive, fast reject first):
;   1. URL blocklist (regex against the stream URL)
;   2. exclude_non_chinese (channel classifies as tier 6 = Foreign)
;   3. exclude_geo_blocked (channel name contains "[Geo-blocked]")
;   4. probe (HEAD verification -- full or sample)

; URL blocklist: drop any entry whose URL matches one of these
; pipe-separated regex patterns. Built-in defaults (always active,
; see docs/filters.md) include:
;   jmp2\.uk/plu-, cdn-globecast\.akamaized\.net, streamlock\.net,
;   39\.134\.\d+\.\d+:8080, etc.
; Add your own patterns below; combine with `|` (pipe).
[filters]
exclude_url_pattern =

; Exclude non-Chinese channels: when 1, drop any channel that
; classifies as tier 6 (Foreign / 外文). The classification logic
; lives in core/channel_name.py; it correctly keeps CCTV-style
; names like "CCTV1" / "CCTV-4K" (which have no Chinese ideographs
; but are tier 1) and recognized HK/MO/TW names like "TVB Jade".
;
; This trims iptv-org's default index (~99% foreign / Spanish /
; Latin American / European channels) down to the small Chinese-
; relevant subset.
;
; Examples (with classify() result):
;   "CCTV1"             -> tier 1 -> KEEP
;   "CCTV-4K"           -> tier 1 -> KEEP
;   "湖南卫视 (1080p)"  -> tier 2 -> KEEP
;   "TVB Jade"          -> tier 4 -> KEEP
;   "TVBS News"         -> tier 4 -> KEEP
;   "凤凰中文台"        -> tier 4 -> KEEP
;   "Candelaria TV"     -> tier 6 -> DROP
;   "TRIVU-TV"          -> tier 6 -> DROP
;   "Nickelodeon Toons" -> tier 6 -> DROP
;
; Default: 1 (on). Set to 0 to disable.
exclude_non_chinese = 1

; Exclude [Geo-blocked] channels: when 1, drop any channel whose
; display name contains the marker "[Geo-blocked]". This marker
; is appended by iptv-org for streams that are confirmed
; unreachable from the user's region -- keeping them just wastes
; probe slots. The marker is detected case-insensitively.
;
; Examples:
;   "CCTV1 [Geo-blocked]"  -> DROP
;   "Channel 13 [Not 24/7]" -> KEEP (different marker)
;   "TVB Jade"             -> KEEP (no marker)
;
; Default: 1 (on). Set to 0 to disable.
exclude_geo_blocked = 1

; ----- Channel whitelist (optional) -----
; When non-empty, ONLY channels whose normalized name matches one of
; these pipe-separated regex patterns survive. Leave empty (the
; default) to keep everything that passed the filters above.
;
; Matching is done against the *normalized* name, so "CCTV-1",
; "CCTV1综合" and "CCTV 1 HD" all match the pattern "CCTV1".
; Case-insensitive.
;
; Examples:
;   whitelist = CCTV                 -> every CCTV channel
;   whitelist = ^CCTV1$              -> exactly CCTV1
;   whitelist = 卫视                  -> every satellite channel
;   whitelist = CCTV|卫视             -> CCTV plus all satellites
;   whitelist = 湖南|浙江|江苏卫视      -> three provinces
;
; WARNING: a wrong pattern can leave you with an empty playlist. The
; tool refuses to write an empty result -- it falls back to the last
; cached playlist instead, so you can fix the ini and retry.
whitelist =

; Probe mode: how to verify each channel is reachable before
; keeping it in the playlist.
;
;   "full"   -- HEAD every URL individually. Slow for big lists
;               (10000 channels @ 1.5s timeout / 16-way concurrency
;               ~= 1-2 minutes best case, ~16 minutes worst case) but
;               eliminates every dead link. RECOMMENDED for one-shot
;               use to build a clean baseline playlist.
;
;   "sample" -- per tier, sample N entries; if pass rate is below
;               probe_min_success_rate the WHOLE tier is dropped.
;               Fast (~5s for any size) but only probabilistic.
;               Useful when you want fresh data every launch and
;               can't afford a full probe.
;
;   "off"    -- no probe at all. Trust upstream + URL blocklist +
;               name filters only. Fastest but riskiest.
;
; Default: full (slow but accurate -- recommended for first build).
probe_mode = full
probe_sample_size = 8
probe_timeout = 1.5
probe_concurrency = 16
probe_min_success_rate = 0.20

; ----- Player -----
[player]
; Leave empty to auto-detect PotPlayer.
; Or set explicit path: C:\Program Files\DAUM\PotPlayer\PotPlayerMini64.exe
path =