; ============================================================
;   iptv-desktop -- source.ini
;
;   本文件控制 iptv-desktop 的所有可调参数。
;   双击 iptv-desktop.exe 时读取此文件。
;
;   语法:
;     ;  -- 分号开头 = 整行注释
;     #  -- 井号开头 = 整行注释
;     ; 或 #  -- 跟在值后面 = 行内注释(同 configparser 的 inline 注释)
;
;   章节布局(可改项优先,默认值次之):
;     [filters]       过滤与探测参数    ←  最常改
;     [player]        PotPlayer 路径     ←  常改
;     [merge]         合并去重规则       ←  偶尔改
;     [sources.*]     上游 m3u 源        ←  进阶用户才改
;
;   改了不生效?  检查等号两侧,确认没 BOM、没全角空格。
; ============================================================


; ============================================================
;   [可改] 过滤与探测 (重启 exe 生效)
; ============================================================
[filters]
;   探测每个 URL 是否真实可达。
;     "full"   = 逐条探测,慢但准(首跑推荐,1-2 分钟)
;     "sample" = 每层抽样,5 秒内完成,但只挑代表性 URL
;     "off"    = 不探测,信上游,最快但最不靠谱
probe_mode = full                 ;  默认 full

;   单 URL 超时秒数。建议 1.0 ~ 2.0。
probe_timeout = 1.5               ;  默认 1.5

;   并发探测线程数。
;     家用宽带 16-32 合适
;     太大会被 CDN 限速,反而更慢
probe_concurrency = 16            ;  默认 16

;   sample 模式专用:每层抽样多少条。
probe_sample_size = 8             ;  默认 8

;   sample 模式专用:某层通过率低于此值则整层丢弃。
probe_min_success_rate = 0.20     ;  默认 0.20 (20%)

;   频道白名单。留空 = 不限制。
;   匹配"归一化名字",正则语法,管道 | 分隔多个。
;     例: CCTV                  匹配所有 CCTV
;     例: ^CCTV1$               只保留 CCTV1
;     例: CCTV|卫视              CCTV + 所有卫视
;     例: 湖南|浙江|江苏卫视     三省卫视
whitelist =                       ;  默认留空

;   排除非中文频道 (1 = 开启 / 0 = 关闭)。
;   关闭后会保留所有外语频道(西班牙/欧美/拉丁等),
;   iptv-org 的全集有 13 万+频道,其中 99% 是外语。
exclude_non_chinese = 1           ;  默认 1 (开)

;   排除 [Geo-blocked] 标记的频道 (1 / 0)。
;   iptv-org 给确认不可达的频道加这个标签,
;   留着只是浪费探测名额。
exclude_geo_blocked = 1           ;  默认 1 (开)

;   URL 黑名单。管道 | 分隔多个正则。
;   匹配任何一条就丢弃整个 entry。
;   系统已内建一组规则(见 docs/filters.md),
;     在下面追加你自己的规则即可。
exclude_url_pattern =             ;  默认留空


; ============================================================
;   [可改] 播放器路径
; ============================================================
[player]
;   留空 = 自动检测 PotPlayer(常见安装路径都能识别)
;   填完整路径可以覆盖自动检测:
;     path = C:\Program Files\DAUM\PotPlayer\PotPlayerMini64.exe
path =                           ;  默认留空


; ============================================================
;   [可改] 合并去重
; ============================================================
[merge]
;   每个频道保留几个 URL(HD/FHD/4K 视为同一频道)。
;   0 = 不限制(每个源的所有 URL 都会写进 playlist)
per_channel_cap = 3               ;  默认 3


; ============================================================
;   [进阶] 上游源
;   除非换源或禁掉某个源,否则无需修改。
;   三个源默认全开,共 11000+ 频道。
; ============================================================

; ----- 1/3 主源:collect-iptv (已分类的中文清单,快而准) -----
[sources.collect-iptv]
;  jsDelivr 在国内比 raw.githubusercontent.com 快得多,所以主用 jsDelivr,
;  mirrors 留 raw + GitHub Pages 作为 fallback。
url     = https://cdn.jsdelivr.net/gh/zilong7728/Collect-IPTV@main/best_sorted.{ext}
format  = m3u
mirrors = https://raw.githubusercontent.com/zilong7728/Collect-IPTV/main/best_sorted.{ext}|https://zilong7728.github.io/Collect-IPTV/best_sorted.{ext}
enabled = 1                       ;  默认开

; ----- 2/3 备源:iptv-org (全集 138k+,含外语) -----
[sources.iptv-org]
url     = https://iptv-org.github.io/iptv/index.m3u
format  = m3u
mirrors =
enabled = 1                       ;  默认开

; ----- 3/3 可选:Guovin fork (你 fork 仓库自跑) -----
[sources.guovin-fork]
;  Guovin/iptv-api 公开 URL 已弃用,需要自己 fork 仓库并启用 Actions。
;  启用后,把 fork 的 release URL 填到下面,enabled=1。
;  默认指向 r3zound 的 fork(若 release 存在即自动启用)。
url     = https://github.com/r3zound/iptv-api/releases/download/playlist-latest/result.m3u
format  = m3u
mirrors =
enabled = 1                       ;  默认开(若 release 不存在会被自动跳过)

; ----- [可选/默认关] -----
[sources.bjzhou-fork]
;  bjzhou/iptv-collector 不发布公开 m3u,自己跑工具才能产出。
url     =
format  = m3u
mirrors =
enabled = 0

[sources.tmxk2020-fork]
;  tmxk2020/ITV 同上,不发布公开 m3u。
url     =
format  = m3u
mirrors =
enabled = 0